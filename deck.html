<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Names & Faces</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <div class="topbar">
    <div class="topbar-title">
      <a href="index.html" class="brand-link" title="Home">
        <picture>
          <source srcset="assets/logo-white.png" media="(prefers-color-scheme: dark)">
          <img src="assets/logo-purple.png" alt="Lutheran High School" class="brand-mark">
        </picture>
      </a>
      <div>
        <h1 id="title">Loading…</h1>
        <p class="subtitle" id="subtitle"></p>
      </div>
    </div>
    <div class="topbar-nav">
      <a href="#" id="edit-link" class="hidden">Edit Deck</a>
      <a href="index.html">&larr; Home</a>
    </div>
  </div>

  <div id="empty-msg" class="card hidden">No students in this deck yet. Build one from <a href="deck-builder.html">Create New Deck</a>.</div>

  <div id="quiz" class="card flashcard hidden">
    <div class="progress" id="progress"></div>
    <div class="frame"><img id="photo" alt="Student photo"></div>
    <div class="name" id="name-display"></div>
    <div id="missing-photo-container"></div>
    <div class="actions">
      <button class="secondary" id="reveal-btn">Reveal Name</button>
      <button id="next-btn">Next &rarr;</button>
    </div>
    <div class="actions">
      <button class="secondary" id="restart-btn">Shuffle &amp; Restart</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
requireLogin();

const params = new URLSearchParams(location.search);
const deckId = params.get("d");

let cards = [];
let index = 0;

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

async function showCard() {
  const card = cards[index];
  document.getElementById("progress").textContent = `Card ${index + 1} of ${cards.length}`;
  document.getElementById("name-display").textContent = "";
  document.getElementById("photo").src = "";
  const missingPhotoContainer = document.getElementById("missing-photo-container");
  missingPhotoContainer.innerHTML = "";
  await loadCardImage(document.getElementById("photo"), card);
  // Only offered when the card is actually bound to a master student record
  // — a name that never matched anyone has nothing to attach a photo to.
  // This is the highest-traffic page in the app (quizzing), so it's the
  // most natural place to notice and fix a missing photo — previously this
  // was only offered on the "View All" page and student search, both of
  // which require already knowing which student to look for.
  if (!card.hasPhoto && card.masterStudentId) {
    renderAddPhotoControl(missingPhotoContainer, card.masterStudentId, () => {
      card.hasPhoto = true;
      loadCardImage(document.getElementById("photo"), { hasPhoto: true, photoUrl: `/api/master/photo/${card.masterStudentId}` });
    });
  }
}

document.getElementById("reveal-btn").addEventListener("click", () => {
  const card = cards[index];
  document.getElementById("name-display").textContent = studentDisplayName(card);
});

document.getElementById("next-btn").addEventListener("click", () => {
  index = (index + 1) % cards.length;
  showCard();
});

document.getElementById("restart-btn").addEventListener("click", () => {
  cards = shuffle(cards);
  index = 0;
  showCard();
});

async function init() {
  if (!deckId) {
    document.getElementById("title").textContent = "Deck not found";
    return;
  }
  const res = await apiFetch(`/api/decks/${encodeURIComponent(deckId)}/cards`);
  if (!res.ok) {
    document.getElementById("title").textContent = "Deck not found";
    return;
  }
  const data = await res.json();
  document.getElementById("title").textContent = data.label;
  const editLink = document.getElementById("edit-link");
  editLink.href = `deck-edit.html?d=${encodeURIComponent(deckId)}`;
  editLink.classList.remove("hidden");
  document.getElementById("subtitle").textContent = `${data.cards.length} student${data.cards.length === 1 ? "" : "s"}`;
  if (data.cards.length === 0) {
    document.getElementById("empty-msg").classList.remove("hidden");
    return;
  }
  cards = shuffle(data.cards);
  document.getElementById("quiz").classList.remove("hidden");
  showCard();
}

init();
</script>
</body>
</html>
