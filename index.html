<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Names & Faces</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login-view" class="page login-box hidden">
  <picture>
    <source srcset="assets/logo-white.png" media="(prefers-color-scheme: dark)">
    <img src="assets/logo-purple.png" alt="Lutheran High School" class="brand-mark">
  </picture>
  <h1>Names &amp; Faces</h1>
  <p class="subtitle" id="auth-subtitle">Log in with your school email to continue.</p>
  <div class="card">
    <form id="auth-form">
      <input type="email" id="email" placeholder="you@lhsparker.org" autocomplete="username" required>
      <div style="height:10px;"></div>
      <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
      <div style="height:10px;"></div>
      <input type="password" id="confirm-password" placeholder="Confirm password" autocomplete="new-password" class="hidden" required>
      <div class="error-msg" id="auth-error"></div>
      <button type="submit" id="auth-submit" style="width:100%; margin-top:10px; justify-content:center;">Log In</button>
    </form>
    <p style="margin-top:14px; font-size:0.9rem;">
      <a href="#" id="auth-toggle">Need an account? Create one</a>
    </p>
  </div>
</div>

<div id="home-view" class="page hidden">
  <div class="topbar">
    <div class="topbar-title">
      <picture>
        <source srcset="assets/logo-white.png" media="(prefers-color-scheme: dark)">
        <img src="assets/logo-purple.png" alt="Lutheran High School" class="brand-mark">
      </picture>
      <div>
        <h1>Names &amp; Faces</h1>
        <p class="subtitle">Pick a deck to study, or build a new one.</p>
      </div>
    </div>
    <div class="topbar-nav">
      <a href="admin.html" id="master-db-link" class="hidden">Master Database</a>
      <a href="users.html" id="manage-users-link" class="hidden">Manage Users</a>
      <a href="#" id="logout-link">Log Out</a>
    </div>
  </div>

  <div class="card">
    <h2 style="margin-top:0;">Find a Student</h2>
    <p class="subtitle" style="margin-bottom:10px;">See what a student looks like, by name.</p>
    <form id="student-search-form" style="display:flex; gap:10px;">
      <input type="text" id="student-search-input" placeholder="Type a student's name…">
      <button type="submit" style="flex-shrink:0;">Search</button>
    </form>
    <div id="search-result"></div>
  </div>

  <div class="grid" id="deck-grid"></div>
</div>

<script src="app.js"></script>
<script>
let mode = "login"; // "login" | "signup"

function setMode(next) {
  mode = next;
  const confirmField = document.getElementById("confirm-password");
  const toggle = document.getElementById("auth-toggle");
  const submit = document.getElementById("auth-submit");
  const subtitle = document.getElementById("auth-subtitle");
  if (mode === "signup") {
    confirmField.classList.remove("hidden");
    confirmField.required = true;
    toggle.textContent = "Have an account? Log in";
    submit.textContent = "Create Account";
    subtitle.textContent = "Create an account with your school email to get started.";
  } else {
    confirmField.classList.add("hidden");
    confirmField.required = false;
    toggle.textContent = "Need an account? Create one";
    submit.textContent = "Log In";
    subtitle.textContent = "Log in with your school email to continue.";
  }
  document.getElementById("auth-error").textContent = "";
}

document.getElementById("auth-toggle").addEventListener("click", (e) => {
  e.preventDefault();
  setMode(mode === "login" ? "signup" : "login");
});

async function render() {
  const loggedIn = !!getToken();
  document.getElementById("login-view").classList.toggle("hidden", loggedIn);
  document.getElementById("home-view").classList.toggle("hidden", !loggedIn);
  if (!loggedIn) return;

  const me = await loadMe();
  document.getElementById("manage-users-link").classList.toggle("hidden", !me.isAdmin);
  document.getElementById("master-db-link").classList.toggle("hidden", !me.isAdmin);

  const decks = await loadDecks();
  const grid = document.getElementById("deck-grid");
  grid.innerHTML =
    decks.map((d) => `
      <div class="deck-tile" data-deck-id="${d.id}">
        <a class="deck-tile-link" href="deck.html?d=${d.id}">${d.label}<small>${d.entryCount} student${d.entryCount === 1 ? "" : "s"}</small></a>
        <div class="deck-tile-actions">
          <a href="deck.html?d=${d.id}" class="btn">Practice</a>
          <a href="deck-view.html?d=${d.id}" class="secondary btn">View All</a>
          <a href="deck-edit.html?d=${d.id}" class="secondary btn">Edit</a>
          <button class="danger delete-deck-btn">Delete</button>
        </div>
      </div>
    `).join("") +
    `<a class="collection-tile all" href="deck-builder.html">+ Create New Deck</a>`;

  grid.querySelectorAll(".delete-deck-btn").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const tile = btn.closest(".deck-tile");
      const deckId = tile.dataset.deckId;
      const label = tile.querySelector(".deck-tile-link").firstChild.textContent.trim();
      if (!confirm(`Delete the deck "${label}"? This cannot be undone.`)) return;
      await apiFetch(`/api/decks/${deckId}`, { method: "DELETE" });
      await loadDecks(true);
      render();
    });
  });
}

document.getElementById("auth-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const errorEl = document.getElementById("auth-error");
  errorEl.textContent = "";

  if (mode === "signup") {
    if (!/^[^\s@]+@lhsparker\.org$/i.test(email)) {
      errorEl.textContent = "Signup is restricted to @lhsparker.org email addresses.";
      return;
    }
    const confirmPassword = document.getElementById("confirm-password").value;
    if (password !== confirmPassword) {
      errorEl.textContent = "Passwords do not match.";
      return;
    }
    if (password.length < 8) {
      errorEl.textContent = "Password must be at least 8 characters.";
      return;
    }
  }

  try {
    const res = await fetch(API_BASE + (mode === "signup" ? "/api/signup" : "/api/login"), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok) {
      errorEl.textContent = data.error || (mode === "signup" ? "Could not create account" : "Login failed");
      return;
    }
    setToken(data.token);
    render();
  } catch (err) {
    errorEl.textContent = "Could not reach the server. Try again.";
  }
});

document.getElementById("logout-link").addEventListener("click", (e) => {
  e.preventDefault();
  logout();
});

// "Find a Student" — best-effort, auto-pick the clear winner; only ask the
// user to choose when it's genuinely ambiguous (a name matching several
// students about equally well). This is a deliberate, scoped exception to
// the app's "no fuzzy matching" default (see similarity() in app.js) — the
// same one deck-edit.js's "Add a Student" search already relies on.
const SEARCH_SCORE_THRESHOLD = 0.35;
const CLEAR_MATCH_SCORE = 0.95;
const CLEAR_MATCH_GAP = 0.15;

document.getElementById("student-search-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const query = document.getElementById("student-search-input").value.trim();
  const resultEl = document.getElementById("search-result");
  resultEl.innerHTML = "";
  if (!query) return;
  resultEl.innerHTML = "<p>Searching…</p>";

  const students = await loadMasterStudents();
  const scored = students
    .map((s) => ({ student: s, score: similarity(query, s.name) }))
    .filter((r) => r.score >= SEARCH_SCORE_THRESHOLD)
    .sort((a, b) => b.score - a.score);

  if (scored.length === 0) {
    resultEl.innerHTML = `<p>No student found matching "${query}".</p>`;
    return;
  }

  const top = scored[0];
  const second = scored[1];
  const isClear = top.score >= CLEAR_MATCH_SCORE || !second || (top.score - second.score) >= CLEAR_MATCH_GAP;

  if (isClear) {
    renderStudentResult(resultEl, top.student);
  } else {
    renderCandidatePicker(resultEl, query, scored.slice(0, 5));
  }
});

function renderStudentResult(container, student) {
  container.innerHTML = "";
  const list = document.createElement("div");
  list.className = "roster-list";
  container.appendChild(list);
  const card = document.createElement("div");
  card.className = "roster-item";
  card.innerHTML = `<img alt="${student.name}"><div class="name">${student.name}${student.disambiguator ? ` (${student.disambiguator})` : ""}</div>`;
  loadCardImage(card.querySelector("img"), student);
  list.appendChild(card);
  if (!student.hasPhoto) {
    renderAddPhotoControl(card, student.id, () => {
      loadCardImage(card.querySelector("img"), { hasPhoto: true, photoUrl: `/api/master/photo/${student.id}` });
    });
  }
}

function renderCandidatePicker(container, query, scored) {
  container.innerHTML = `<p>A few students match "${query}" — pick the right one:</p>`;
  const list = document.createElement("div");
  list.className = "roster-list";
  container.appendChild(list);
  for (const { student } of scored) {
    const item = document.createElement("div");
    item.className = "roster-item";
    item.style.cursor = "pointer";
    item.innerHTML = `<img alt="${student.name}"><div class="name">${student.name}${student.disambiguator ? ` (${student.disambiguator})` : ""}</div>`;
    loadCardImage(item.querySelector("img"), student);
    item.addEventListener("click", () => renderStudentResult(container, student));
    list.appendChild(item);
  }
}

setMode("login");
render();
</script>
</body>
</html>
